
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "header1 header1"
                "menu content"
                "footer footer";
            grid-template-columns: 2fr 4fr;
            gap: 3px;
            background-color: dodgerblue;
            padding: 5px;
        }

        .container div {
            padding: 10px;
        }

        /* Header */
        .container div.header {
            grid-area: header;
            text-align: center;
            background-color: navy;
            color: white;
        }

        /* Second Header */
        .container div.header1 {
            grid-area: header1;
            text-align: center;
            background-color: skyblue;
            color: black;
        }

        /* Menu */
        .container div.menu {
            grid-area: menu;
            background-color: lightyellow;
            color: darkblue;
        }

        .menu a {
            color: darkblue;
            text-decoration: none;
            line-height: 2;
        }

        .menu a:hover {
            color: red;
        }

        /* Content */
        .container div.content {
            grid-area: content;
            background-color: lightgreen;
            color: darkgreen;
        }

        /* Footer */
        .container div.footer {
            grid-area: footer;
            text-align: center;
            background-color: darkslategray;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>My Header</h1>
        </div>

        <div class="header1">
            <h2>My Header</h2>
        </div>

        <div class="menu">
            <h3>Menu</h3>
            <a href="#">Link 1</a><br>
            <a href="#">Link 2</a><br>
            <a href="#">Link 3</a>
        </div>

        <div class="content">
            <h2>Content</h2>
            <p>This is the content section.</p>
        </div>

        <div class="footer">
            <h3>My Footer</h3>
        </div>

    </div>

</body>
</html>
